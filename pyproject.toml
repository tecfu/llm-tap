[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-tap"
version = "0.1.0"
description = "OpenAI-compatible inference traffic capture tap"
requires-python = ">=3.10"
dependencies = ["mitmproxy>=11,<12"]

[project.scripts]
llm-tap = "tap:main"

[tool.setuptools]
py-modules = ["tap"]
