services:
  tap:
    image: mitmproxy/mitmproxy:latest
    container_name: llm-tap
    restart: unless-stopped
    network_mode: host
    environment:
      - UPSTREAM=http://127.0.0.1:${PORT:-8000}
    volumes:
      - ./tap.py:/tapper.py:ro
      - /tmp:/tmp
    command: >-
      mitmdump --mode reverse:http://127.0.0.1:${PORT:-8000}@${TAP_PORT:-8001}
      -s /tapper.py --set confdir=/tmp/mitmconf
